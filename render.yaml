# Render Blueprint: deploys the viewer as a static site, with hand control running in the browser.
# Dashboard route: New > Static Site > pick this repo, Build Command and Publish Directory as below.
services:
  - type: web
    name: catalogue
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # Let this page (and only this page) use the webcam for hand control.
      - path: /*
        name: Permissions-Policy
        value: camera=(self)
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /mediapipe/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
